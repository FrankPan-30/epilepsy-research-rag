name: Portable checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  portable:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependency-free synthetic demo
        run: python demo.py --check
      - name: Install small test dependency
        run: python -m pip install --no-cache-dir pymupdf==1.26.7
      - name: Portable and native runtime tests
        run: python -m unittest tests.UnitTests tests.PDFSourceTests test_web test_runtime -v
      - name: Browser script syntax
        run: node --check web/app.js
      - name: POSIX launcher syntax
        if: runner.os != 'Windows'
        run: bash -n start_web.sh "Start Web.command"

  windows-pipeline:
    if: github.event.repository.private == false && github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RAG_LAUNCHER_NO_PAUSE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Bootstrap the actual Windows launcher and verify startup
        shell: pwsh
        run: |
          & '.\Start Web.bat' --help
          exit $LASTEXITCODE
      - name: Download pinned public local model (no paid API)
        run: .\.venv\Scripts\python.exe download_model.py
      - name: Real PDF, local embeddings, HTTP citations and MCP pipelines
        run: .\.venv\Scripts\python.exe -m unittest test_pdf_pipeline test_web_pipeline -v
