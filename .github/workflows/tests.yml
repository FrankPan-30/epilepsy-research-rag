name: Portable checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependency-free synthetic demo
        run: python demo.py --check
      - name: Install small test dependency
        run: python -m pip install --no-cache-dir pymupdf==1.26.7
      - name: Portable unit tests
        run: python -m unittest tests.UnitTests -v
