name: Bug report
description: Report a reproducible extraction, retrieval or integration problem.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and actual behavior. Use synthetic or redistributable examples.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Commands, a short query and relevant error output. Remove personal paths, tokens and private text.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, project commit and dependency versions.
    validations:
      required: true
